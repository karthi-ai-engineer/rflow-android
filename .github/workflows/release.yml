name: Release

# A tag vX.Y.Z on main: build the signed APK and publish Rflow.apk and Rflow.apk.sha256, the names the app's updater
# and the website look for. The release key comes from the repository's secrets, never from git.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: The tag matches the app's version
        run: |
          version=$(sed -n 's/^val rflowVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but the app says $version"; exit 1; }
      - name: Tests
        run: ./gradlew testReleaseUnitTest
      - name: Signed APK
        env:
          KEYSTORE_B64: ${{ secrets.RFLOW_KEYSTORE_B64 }}
          RFLOW_KEYSTORE_PASSWORD: ${{ secrets.RFLOW_KEYSTORE_PASSWORD }}
          RFLOW_KEY_ALIAS: ${{ secrets.RFLOW_KEY_ALIAS }}
          RFLOW_KEY_PASSWORD: ${{ secrets.RFLOW_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "The release key isn't in the repository's secrets"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/rflow.jks"
          RFLOW_KEYSTORE="$RUNNER_TEMP/rflow.jks" ./gradlew assembleRelease
          rm "$RUNNER_TEMP/rflow.jks"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk dist/Rflow.apk
          cd dist && sha256sum Rflow.apk > Rflow.apk.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Rflow.apk dist/Rflow.apk.sha256 --title "Rflow for Android ${GITHUB_REF_NAME#v}" --generate-notes
